name: Security

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    # Code scanning uploads require GitHub Advanced Security on a private
    # repository. Without it the analysis runs to completion and then fails at
    # the upload step with "Resource not accessible by integration", which would
    # leave Security permanently red for no security reason. Skipping cleanly on
    # private repositories keeps the signal honest; the job runs in full as soon
    # as the repository is public or GHAS is enabled.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4.37.3
      - uses: github/codeql-action/analyze@v4.37.3

  dependency-review:
    # Dependency review has the same GHAS requirement on private repositories.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Go vulnerability report
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
        working-directory: backend
      - name: Package audit report
        continue-on-error: true
        run: pnpm audit --audit-level high
      - name: Advisory policy
        run: echo "CodeQL and dependency review are hard gates; external advisory services report without blocking transiently."
