name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: repometeor_test
          POSTGRES_USER: repometeor
          POSTGRES_PASSWORD: repometeor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repometeor -d repometeor_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./internal/scoring ./internal/github ./internal/api
      - name: PostgreSQL integration tests
        env:
          REPOMETEOR_TEST_DATABASE_URL: postgres://repometeor:repometeor@127.0.0.1:5432/repometeor_test?sslmode=disable
        # -p 1 is required, not an optimisation. Both suites share one database
        # and isolate themselves by truncating every table on setup; Go tests
        # packages in parallel by default, so without this one suite truncates
        # while the other is mid-seed, producing deadlocks and foreign key
        # violations. Keep this in step with the test-integration Make target.
        run: go test -tags=integration -p 1 ./internal/repository ./internal/api
      - name: Build commands
        run: go build ./cmd/...

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate OpenAPI
        run: pnpm exec redocly lint contracts/openapi.yaml

  containers-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure deterministic demo
        run: cp .env.example .env
      - name: Build and start stack from empty state
        run: docker compose up --build --detach --wait
      - name: Smoke API and web
        run: ./scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes
