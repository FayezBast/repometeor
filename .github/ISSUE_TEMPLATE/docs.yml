name: Documentation issue
description: Report unclear, stale, or missing documentation
labels: [documentation]
body:
  - type: input
    id: page
    attributes: { label: Page or file }
    validations: { required: true }
  - type: textarea
    id: unclear
    attributes: { label: "What is unclear or wrong?" }
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes: { label: Suggested improvement }
