name: repometeor

services:
  postgres:
    image: postgres:16.10-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: repometeor
      POSTGRES_USER: repometeor
      POSTGRES_PASSWORD: repometeor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repometeor -d repometeor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    command: ["/usr/local/bin/migrate", "up"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    command: ["/usr/local/bin/seed"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    env_file: .env
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file: .env
    depends_on:
      seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_GITHUB_REPO_URL: ${NEXT_PUBLIC_GITHUB_REPO_URL:-https://github.com/repometeor/repometeor}
    environment:
      INTERNAL_API_URL: http://api:8080
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
      NEXT_PUBLIC_GITHUB_REPO_URL: ${NEXT_PUBLIC_GITHUB_REPO_URL:-https://github.com/repometeor/repometeor}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    restart: unless-stopped

volumes:
  postgres-data:
